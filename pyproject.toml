[project]
name = "reporadar"
version = "0.1.0"
description ="A GitHub developer intelligence and repository analytics tool"
readme = "README.md"
authors = [
    { name = "Vaishali Jain", email = "vaishalijain2107@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pillow>=13.0.0",
    "requests>=2.34.2",
]



[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]
